#
# Alembic-Konfiguration. Die Datenbankadresse steht nie hier, sondern in
# FINANZMANAGER_MIGRATION_DATABASE_URL (Eigentümerrolle; Vorlage: .env.example).
# Migrationen werden handgeschrieben; gemergte Migrationen werden nie geändert (CLAUDE.md).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
