# Basiszinssatz nach § 247 BGB, ein Eintrag je Halbjahr, lückenlos (Fachkonzept Kap. 7).
# Sätze in Prozent, als Text in Anführungszeichen.
quelle: Deutsche Bundesbank, Bekanntgabe nach § 247 Abs. 2 BGB
geprueft_von: "noch offen"
