  Vollständige Reihe ab 2002-01-01 aus der Bundesbank-Zeitreihe ergänzen. Bisher stehen nur
  die Sätze ab 2024-01-01: 2024-01-01 bis 2025-07-01 wie vom Maintainer zu GK-0001 aus der
  Übersicht der Bundesbank angegeben, 2025-07-01 bis 2026-07-01 wie in Fachkonzept Kap. 7.
