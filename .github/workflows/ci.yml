# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Prüft jeden Pull Request und jeden Stand von main gegen die Regeln aus CLAUDE.md.
# Actions sind auf Commit-SHAs festgeschrieben (Repository-Einstellung); Updates
# übernimmt Dependabot. uv ist auf dieselbe Version wie in der Entwicklung gesetzt.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - name: uv installieren
        run: python -m pip install --disable-pip-version-check "uv==0.11.32"

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: Ruff (Lint)
        run: uv run --locked ruff check --output-format=github

      - name: Ruff (Format)
        run: uv run --locked ruff format --check

      - name: Pyright (strict)
        run: uv run --locked pyright

      - name: Modulgrenzen (import-linter)
        run: uv run --locked lint-imports

      - name: Tests
        run: uv run --locked pytest
