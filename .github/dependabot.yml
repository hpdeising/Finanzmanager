# Versionsupdates durch Dependabot.
# Sicherheitsupdates sind unabhängig davon in den Repository-Einstellungen aktiviert.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      entwicklungswerkzeuge:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (native Neufassung) liefert die JavaScript-API nicht mehr mit, die
      # openapi-typescript zum Erzeugen der API-Typen braucht (Peer typescript ^5). Aufheben,
      # sobald openapi-typescript TypeScript 7 unterstützt.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      entwicklungswerkzeuge:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Aktivieren, sobald Docker-Dateien existieren (M9):
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
