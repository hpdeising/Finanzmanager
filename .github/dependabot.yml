# Versionsupdates durch Dependabot.
# Sicherheitsupdates sind unabhängig davon in den Repository-Einstellungen aktiviert.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

