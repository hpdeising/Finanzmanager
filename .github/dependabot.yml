# Versionsupdates durch Dependabot.
# Sicherheitsupdates sind unabhängig davon in den Repository-Einstellungen aktiviert.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      entwicklungswerkzeuge:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Aktivieren, sobald frontend/ bzw. Docker-Dateien existieren (M5, M9):
  # - package-ecosystem: "npm"
  #   directory: "/frontend"
  #   schedule:
  #     interval: "weekly"
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
